[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "animal-sound-retrieval"
version = "1.0.0"
description = "Hệ thống tìm kiếm âm thanh động vật tương đồng sử dụng K-Means (K=13) và KNN (KDTree) trên vector đặc trưng 92 chiều"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0,<3.0.0",
    "pandas>=2.2.0,<4.0.0",
    "scipy>=1.12.0,<2.0.0",
    "scikit-learn>=1.5.0,<2.0.0",
    "joblib>=1.4.0,<2.0.0",
    "librosa>=0.10.2,<1.0.0",
    "soundfile>=0.12.1,<1.0.0",
    "matplotlib>=3.8.0,<4.0.0",
    "altair>=5.3.0,<7.0.0",
    "streamlit>=1.45.0,<2.0.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
    "pgvector>=0.3.0,<1.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<10.0.0",
]

[tool.setuptools.packages.find]
include = ["web_app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v"
